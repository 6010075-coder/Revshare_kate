[project]
name = "integration-hub-revshare"
version = "0.1.0"
description = "Intake and preview Integration Hub partner revenue-share reports for the Altegio Revenue Accrual sheet"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "google-api-python-client>=2.160.0",
  "google-auth>=2.38.0",
  "jinja2>=3.1.6",
  "openpyxl>=3.1.5",
  "pymysql>=1.1.1",
  "pypdf>=5.1.0",
  "python-multipart>=0.0.32",
  "pyyaml>=6.0.2",
  "xlrd>=2.0.1",
  "uvicorn>=0.53.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28.1", "pytest>=8.3.0"]

[project.scripts]
revshare = "revshare.cli:main"
revshare-web = "revshare.web:run"
revshare-worker = "revshare.worker:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
