# What we write by default: the partner-reported figure for the month.
# Formulas in the sheet should keep calculating Altegio's share.
# Never overwrite formula cells. Preview every write before applying.
write_policy:
  default_field: reported_turnover
  preview_before_write: true
  never_overwrite_formulas: true
  approve_phrase: "вноси"

deadline:
  day_of_month: 10
  reminder_day: 8

